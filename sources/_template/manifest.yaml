# Boss source manifest — COPY THIS, fill it in, commit to your repo root as `manifest.yaml`.
# You do NOT rewrite how your setup works. You declare it. See ../SOURCE_CONTRACT.md.

node: <your-slug>                 # unique short id, e.g. shoptet-neo
owner: <your-name>                # accountable human

read:
  type: git                       # git | api | export
  url: <repo url or endpoint>     # MUST expose history, not just a snapshot (rule R1)
  ref: main

visibility_default: restricted    # restricted | public  (rule R2 — default is opt-IN to sharing)

layout:                           # node-relative paths; omit any you don't have
  knowledge: knowledge/
  decisions: memory/decisions/
  memory:    memory/
  changelog: CHANGELOG.md
  workflows: .claude/workflows/

domains: []                       # which authority-matrix domains you speak to, e.g. [expansion_product]

anchor_resolvable_externally: false   # true ONLY if your anchors verify without access to your systems

# Onboarding checklist (SOURCE_CONTRACT §4):
#   [ ] history intact & readable
#   [ ] shareable knowledge marked [BOSS: public]
#   [ ] this manifest committed at repo root
#   [ ] entry added to Boss sources/registry.yaml (PR)
