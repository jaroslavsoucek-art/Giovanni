# ============================================================================
# Example calibration actor-score entry — Sarah Vyas
# ============================================================================
# This shows what one actor's entry looks like in
# memory/calibration/actor-scores.yaml after ~6 months of shadow hypothesis
# resolution.
#
# Synthetic numbers — these are illustrative of healthy calibration patterns
# in a partial / deep profile actor, not actual measurements.
# ============================================================================

# (In the real file, this entry sits inside the top-level `actors:` map
# alongside other actors. Shown standalone here for clarity.)

sarah-vyas:
  total_hypotheses: 16
  # Cumulative since shadow tracking started for this actor (~6 months back).

  resolved: 14
  # 14 with recorded verdict (some pending, some expired without verdict).

  matched: 8
  # Hits across all three tiers.

  falsified: 6
  # Misses including 1 resolved-mixed counted as falsified per discipline rule.

  expired: 2
  # 2 past horizon with no signal observed and no human verdict recorded.
  # These are the "didn't get to /shadow-review in time" cases. They are
  # discipline-health signals but don't enter accuracy calculation.

  accuracy_rolling_60d: 0.625
  # 5 matched / 8 resolved in the last 60 days.

  accuracy_rolling_90d: 0.583
  # 7 matched / 12 resolved in the last 90 days.
  # 60d slightly higher than 90d → trend: improving.

  last_calibration: 2026-05-01
  # Last /calibration-report touched this actor's entry.

  trend: improving
  # 60d (0.625) > 90d (0.583) with hysteresis-tolerant margin. Trend label
  # set at /calibration-report time. Was `stable` at previous report;
  # bumped to `improving` after the latest cohort.

  accuracy_by_tier:
    # Healthy three-tier calibration: likely hits 6/9 (66%) — within healthy
    # 60-80% range. possible-but-surprising hits 1/3 (33%) — within healthy
    # 20-40% range. unlikely-but-impactful hits 1/2 (50%) — slightly hot
    # but small sample; not a structural concern yet.

    likely:
      n: 9
      matched: 6
      rate: 0.667

    possible-but-surprising:
      n: 3
      matched: 1
      rate: 0.333

    unlikely-but-impactful:
      n: 2
      matched: 1
      rate: 0.500
      # ⚠ Small-sample warning — 1/2 is above the 5-15% healthy range,
      # but n=2 means we can't read this as bias yet. If next 3
      # unlikely-but-impactful predictions also hit at ≥40%, flag as
      # tier-label-drift in next /calibration-report.

  bias_watch:
    - channel-specificity-miss
    # Identified pattern: predictions about Sarah's communication CONTENT
    # land (she does ask for what was predicted), but predictions about
    # CHANNEL miss (she preferred email when shadow predicted Slack,
    # vice-versa). 3 of 6 misses in the last 60d are channel-specificity
    # misses. Mitigation: explicitly note her channel-preference patterns
    # in expected_signal — tighten search_terms to be channel-aware.
    # Status: open since 2026-04-01. Re-check at 2026-06-01 calibration.

# ============================================================================
# Notes on this example
# ============================================================================
#
# 1. The synthetic numbers are LIKE-FOR-LIKE with patterns observed across
#    asymmetric-power-up actors in early frameworks. Sarah is a high-touch
#    deep profile; calibration should reach 60%+ accuracy on her within
#    ~3-6 months of consistent prediction.
#
# 2. The bias_watch entry illustrates the CHANNEL-SPECIFICITY-MISS pattern
#    that surfaces commonly across stakeholder predictions — direction
#    correct, channel guess wrong. Mitigation lives in tightening the
#    expected_signal template per actor.
#
# 3. The healthy-range commentary on `unlikely-but-impactful` (1/2 = 50%)
#    illustrates the small-sample caveat that should be respected before
#    declaring tier-label-drift. Calibration is a slow signal at small n.
#
# 4. This entry would appear alongside ~10-30 other actor entries in the
#    real actor-scores.yaml. The overall framework calibration is the
#    aggregation across all entries (computed in monthly/<YYYY-MM>.md).
