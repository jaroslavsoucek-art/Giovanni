# Giovanni governance configuration — fork-time customization.
#
# Copy to docs/governance.config.yaml and edit. All keys are optional —
# omitting a key uses the default shown in the comment.
#
# Env vars (GIOVANNI_<KEY_UPPERCASE>) override file values. Useful for
# one-off audits without committing config changes.

# ----------------------------------------------------------------------
# Layer paths — change only if your fork renames directories
# ----------------------------------------------------------------------

# Knowledge directory (relative to repo root). Default: knowledge
knowledge_dir: knowledge

# Memory directory (relative to repo root). Default: memory
memory_dir: memory

# Constitution filename inside knowledge_dir. Default: constitution.md
# Examples: principles.md, lattice_charter.md, <domain>_charter.md
constitution_file: constitution.md

# Operational L1 filename inside memory_dir. Default: CLAUDE_MEMORY.md
# Some forks prefer a domain-naming convention (e.g. lattice_memory.md).
l1_file: CLAUDE_MEMORY.md

# Deliverables directory (relative to repo root). Default: deliverables
# Landing zone for outbound artifacts (drafts, decks, one-pagers, exports).
# Used by the opt-in deliverables lifecycle registry — the registry lint
# rules no-op while <deliverables_dir>/_registry.yaml is absent.
# See docs/governance.md § "Deliverables lifecycle registry".
# Override via env: GIOVANNI_DELIVERABLES_DIR
deliverables_dir: deliverables

# ----------------------------------------------------------------------
# Hard limits — calibrate to your context-window + domain velocity
# ----------------------------------------------------------------------

# L1 line count warn threshold (high finding). Default: 300
# At ~80 tokens/line: 300 ≈ 24k tokens ≈ 12 % of 200k context.
# Smaller-context agents: drop to ~100.
l1_limit: 300

# L1 line count critical threshold (critical finding, STOP-and-audit).
# Default: 400 (≈ 33 % overflow above warn).
l1_limit_critical: 400

# L1 byte budget. Default: 32768 (32 KB).
# The line cap and the byte cap measure different failure modes. A file can
# sit at 200 lines and still be 58 KB — long narrative paragraphs instead of
# short state bullets. Whichever cap trips first, trips.
l1_limit_bytes: 32768

# Digest state byte cap. Default: 32768 (32 KB).
# digest_state.md is rewritten every run; nothing should accumulate. Over the
# cap means it has turned into a journal — rotate, don't raise.
digest_state_limit_bytes: 32768

# Days an ACTIVE topic shard may go untouched before lint flags it.
# Default: 45. A shard nobody has touched is either stale or finished, and
# the 60-day retirement rule never fires for it because nobody set the status.
shard_stale_days: 45

# "N days of silence" claims in L1 / active shards (silence-counter-verified).
# A line with a silence keyword and a counter needs `[verified YYYY-MM-DD]`
# no older than this. Default: 7.
silence_stamp_max_days: 7
# Extra silence keywords for your working language; English defaults always apply.
# silence_keywords: ["<no reply in your language>", "<unanswered in your language>"]

# Strikethrough ratio in L1 (fraction). Default: 0.02 (= 2 %).
# Below this is acceptable transient state. Above is drift signal.
strike_ratio_max: 0.02

# ----------------------------------------------------------------------
# Reference clock
# ----------------------------------------------------------------------

# Date every time-based check treats as "today". Empty / absent = the real date.
#
# Set this ONLY for a frozen snapshot — a bundled example, a captured audit
# state, a fixture fork. It makes cadence checks measure the snapshot's own
# internal age instead of how long ago it was committed.
#
# Do not set it on a live fork. A live fork with a pinned clock silently stops
# reporting every cadence it has, which is the exact opposite of what the
# cadence checks are for.
# snapshot_date: 2026-06-22

# ----------------------------------------------------------------------
# Audit cadence — calibrate to your working cycle
# ----------------------------------------------------------------------

# Full memory audit cadence (days). Default: 35
# Section-by-section L1 review, shard graduation, archival.
audit_full_cadence_days: 35

# Light pruning cadence (days). Default: 14
# Strip strikethroughs, archive resolved items, size check.
audit_light_cadence_days: 14

# Resolved-shard retirement window (days). Default: 60
# How long a `status: resolved` shard sits in topics/ before moving
# to topics/_resolved/.
#
# Recommended values by domain velocity:
#   30  — high-velocity domains (startup pivots, sales lifecycle)
#   60  — default (mixed weekly + monthly cadence)
#   90  — quarterly-cycle domains (board, treasury, fundraising)
#   180 — annual-cycle domains (compliance, audit, year-end planning)
resolved_shard_retirement_days: 60

# ----------------------------------------------------------------------
# Constitution structural rules
# ----------------------------------------------------------------------

# Require {#anchor-id} on every H2/H3 in the constitution.
# Default: true. Disable only if your domain genuinely doesn't need
# cross-section references.
require_anchor_ids: true

# ----------------------------------------------------------------------
# Domain-leak guard — fork-time activity
# ----------------------------------------------------------------------

# Strings forbidden in memory/ + knowledge/ + .claude/ — case-insensitive
# substring match. Populated at fork time with proper nouns from the
# PRIOR domain to catch carry-over during template filling.
#
# Default: [] (no check).
#
# Example shape (fictional fork from "Acme Corp" source):
#   domain_leak_denylist:
#     - Acme
#     - Acme Corp
#     - <prior_ceo_full_name>
#     - <prior_company_codename>
#     - <prior_country_or_region_codes>
#     - <prior_proprietary_platform_names>
#
# Common pattern: list every proper noun that would identify the prior
# domain. Personal names of stakeholders, company / product codenames,
# country codes, internal platform names, partner brands.
domain_leak_denylist: []

# Files allowed to mention denylist strings (relative paths from repo root).
# Use for docs that legitimately reference the source domain
# (e.g. docs/origin.md documenting where Giovanni came from).
domain_leak_allowlist:
  - docs/origin.md
  - docs/test-domain.md

# ----------------------------------------------------------------------
# External write gate
# ----------------------------------------------------------------------

# Channels demoted to ABSOLUTE read-only, as tool-name substrings
# (e.g. slack, teams, gmail). Read by .claude/hooks/block-external-writes.sh:
# any write-shaped call on a listed channel is denied outright, not asked.
#
# Default: [] — demotion is something your fork decides after a misfire,
# not a shipped default. See docs/governance.md § Channel demotion.
#
# Demoting a channel is two edits, not one: this key (the hook reads it) and
# permissions.deny in .claude/settings.json (the harness reads that). Two
# layers on purpose — neither is load-bearing alone.
#
# Override via env: GIOVANNI_READONLY_CHANNELS (comma-separated)
readonly_channels: []

# ----------------------------------------------------------------------
# Branch warning
# ----------------------------------------------------------------------

# Threshold for `check-unmerged-claude-branches.sh` warning.
# Default: 1 (warn on any unmerged claude/* branch).
# Increase if you tolerate a small backlog.
# Override via env: GIOVANNI_BRANCH_WARN_THRESHOLD
# branch_warn_threshold: 1

# Main branch name. Default: main.
# Override via env: GIOVANNI_MAIN_BRANCH
# main_branch: main

# ----------------------------------------------------------------------
# Layers — switch off what your domain does not need
# ----------------------------------------------------------------------

# A layer set to false is off: init does not scaffold it, its lint rules
# no-op (they declare LAYER = "<name>"), its skills refuse to run.
# Set at scaffold time with `init-fork.sh --without predictive,stakeholders,digest`
# or edit here. See docs/autonomy.md § Layers.
#
#   predictive    branch-out, shadow hypotheses, calibration
#   stakeholders  per-person sentiment-trajectory profiles
#   digest        the daily multi-source digest (digest_sources/state, source-puller)
layers:
  predictive: true
  stakeholders: true
  digest: true

# Project-owned lint rules, run next to the plugin's (same contract:
# CHECK_ID + run(ctx), optional LAYER). Default: scripts/lint_rules
# project_lint_rules_dir: scripts/lint_rules

# ----------------------------------------------------------------------
# Autonomy layer — opt-in; every key below is off until you set it
# ----------------------------------------------------------------------
# docs/autonomy.md is the mechanism. The short version: one inbox every loop
# writes to and the principal answers with one word per item; an explicit
# split between paths the assistant may commit on its own and paths that are
# canon; headless runs on a clock; a learning loop that proposes skills from
# repetition and rules from corrections.

# Inbox — shown at session start, ranked, one-word answers.
# inbox:
#   file: inbox.yaml                 # under memory_dir
#   title: "Today"
#   answer_hint: "Answer per item: `<n> yes` · `<n> no` · `<n> later 7d`."
#   overdue_label: "OVERDUE"
#   max_open: 10                     # more than this = the loops produce noise; that is a finding
#   default_expiry_days: 14          # undated items expire; dated items (due:) never do
#   dismiss_days: 30                 # "no" to an undated item mutes its producer for this long
#   lint_to_inbox: true              # lint findings ≥ lint_min_severity become items, and close themselves
#   lint_min_severity: medium
#   refreshers:                      # project commands run at session start; they write items themselves
#     - python3 scripts/<your-refresher>.py

# Autonomy profile — what the Stop hook commits on its own, what stays canon.
# autonomy:
#   auto_commit_paths: ["memory/*"]  # working state: committed at the end of every turn
#   confirm_paths: ["knowledge/*", "CLAUDE.md", ".claude/*", "docs/governance.config.yaml"]
#   auto_push: false                 # true only for a private backup remote
#   commit_prefix: "chore(auto):"

# Learning loop — skills from repetition, rules from corrections.
# learning:
#   enabled: true
#   unit_dirs: []                    # dirs whose next path segment is an instance (masked as *)
#   min_sessions: 3
#   window_days: 90
#   max_candidates: 3
#   retire_after_days: 60
#   correction_markers: ['^\s*no[,.!]', '\bnext time\b', '\bfrom now on\b', '\balways\b', '\bnever\b']
#   history: {...}                   # /giovanni:learn-history — schema in docs/history-bootstrap.md

# Headless runs on a clock — installed with /giovanni:schedule install.
# schedule:
#   - name: morning
#     prompt: "/giovanni:inbox"
#     at: "07:30"
#     weekdays: [1, 2, 3, 4, 5]
#   - name: weekly-learn
#     prompt: "/giovanni:learn"
#     at: "07:45"
#     weekdays: [1]

