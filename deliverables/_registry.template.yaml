# Deliverables registry — single source of truth for the lifecycle status of
# outbound artifacts. Copy to deliverables/_registry.yaml at activation time
# (defer until the flat directory exceeds ~50 files — see deliverables/README.md).
#
# Statuses:
#   live       = maintained artifact / valid reference (changes as the project changes)
#   draft      = in preparation / not yet sent (send queue, pending review)
#   sent       = delivered / presented / published — FROZEN, do not edit
#   superseded = replaced by a newer version or decision — candidate for _archive/ once zero-referenced
#
# Rules (binding — see deliverables/README.md):
#   - New file in deliverables/ => entry here (the deliverables-registry lint rule enforces it).
#   - Status flip (draft->sent, live->superseded) = edit here. NEVER rename/move the file —
#     status lives in metadata, not in the path (anti-link-rot).
#   - _archive/ and dotfiles are outside the registry. REGISTRY.md is auto-generated
#     (scripts/build-deliverables-registry.py) — regenerate after every edit here.
#   - date = creation/send date of the artifact (not last edit).
#
# Example entries below use the synthetic Lattice Finance test domain
# (docs/test-domain.md). Replace with your own artifacts.

entries:
  - file: pricing-v2-model.xlsx
    status: live
    type: artifact
    date: '2026-05-10'
    note: Platform-fee + per-entity pricing model. Rebuilt as assumptions change.

  - file: 2026-05-30_series-b-narrative-v0.3.md
    status: draft
    type: document
    date: '2026-05-30'
    note: Series B narrative draft; awaiting sarah-vyas redline before v0.4.

  - file: 2026-05-18_design-partner-renewal-onepager.pdf
    status: sent
    type: document
    date: '2026-05-18'
    note: Sent to lattice-design-partner-1 renewal contact — FROZEN.
