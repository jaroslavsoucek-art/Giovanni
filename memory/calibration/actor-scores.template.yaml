# ============================================================================
# memory/calibration/actor-scores.yaml — canonical numerical state
# ============================================================================
# This file is the single source of truth for per-actor calibration scores.
# Updated by /calibration-report only. NEVER modified manually except via
# /shadow-review dispute workflow (where principal explicitly overrides a verdict).
#
# Schema versioned via `version` field. Bump on any structural change.
# ============================================================================

version: 1.0
last_updated: <YYYY-MM-DD>
# Date of the most recent /calibration-report update.

actors:

  # Per-actor entry. Keyed by stakeholder slug (matches memory/stakeholders/<slug>.md).
  # ONE entry per actor that has ≥1 shadow hypothesis ever generated.
  # Actors with 0 hypotheses don't appear here.

  <stakeholder-slug>:
    total_hypotheses: 0
    # Cumulative count of all shadow hypotheses for this actor.
    # Increments at each generation; never decrements.

    resolved: 0
    # Count with a recorded verdict (matched | falsified | mixed).
    # Increments at /shadow-review when verdict is recorded.

    matched: 0
    # Subset of `resolved` where verdict = resolved-yes.

    falsified: 0
    # Subset of `resolved` where verdict = resolved-no or resolved-mixed.
    # Note: mixed counts as falsified for accuracy calculation per binding rule
    # (calibration is honest, not generous).

    expired: 0
    # Hypotheses past horizon_at with no human verdict recorded.
    # No accuracy signal but tracked for discipline health.

    accuracy_rolling_60d: null
    # matched / resolved over the last 60 calendar days. Null if n_60d < 3.
    # Recomputed at each /calibration-report run.

    accuracy_rolling_90d: null
    # matched / resolved over the last 90 calendar days. Null if n_90d < 3.

    last_calibration: <YYYY-MM-DD>
    # Date of most recent /calibration-report update for this actor.

    trend: null
    # Enum: improving | stable | degrading | null
    # Null while resolved < 3 (no trend possible).
    # Comparison: accuracy_rolling_60d vs accuracy_rolling_90d, with hysteresis.

    accuracy_by_tier:
      # Per-tier hit rate. Critical IP — the three-tier framing is what makes
      # calibration possible. Healthy ranges:
      #   likely: 0.60-0.80
      #   possible-but-surprising: 0.20-0.40
      #   unlikely-but-impactful: 0.05-0.15
      # Deviation = tier-label drift; recalibrate.

      likely:
        n: 0
        matched: 0
        rate: null  # matched / n; null if n=0

      possible-but-surprising:
        n: 0
        matched: 0
        rate: null

      unlikely-but-impactful:
        n: 0
        matched: 0
        rate: null

    bias_watch: []
    # List of bias-pattern names currently active for this actor.
    # Drawn from controlled vocabulary:
    #   - over-confidence-on-likely
    #   - under-confidence-on-likely
    #   - under-prediction-of-adversarial-moves
    #   - channel-specificity-miss
    #   - actor-direction-flip
    #   - tier-label-drift
    # Mitigated biases drop off the list (audit trail lives in actors/<slug>.md narrative).

  # ----------------------------------------------------------------------------
  # Example (DO NOT include in fork — illustrative schema only):
  # ----------------------------------------------------------------------------
  # example-actor-slug:
  #   total_hypotheses: 14
  #   resolved: 11
  #   matched: 7
  #   falsified: 4
  #   expired: 3
  #   accuracy_rolling_60d: 0.64
  #   accuracy_rolling_90d: 0.60
  #   last_calibration: 2026-05-21
  #   trend: stable
  #   accuracy_by_tier:
  #     likely:
  #       n: 8
  #       matched: 6
  #       rate: 0.75
  #     possible-but-surprising:
  #       n: 2
  #       matched: 1
  #       rate: 0.50
  #     unlikely-but-impactful:
  #       n: 1
  #       matched: 0
  #       rate: 0.0
  #   bias_watch:
  #     - channel-specificity-miss

# ============================================================================
# Notes on this schema
# ============================================================================
#
# 1. Why a single state file rather than per-actor files?
#    Calibration is a rolled-up cross-actor lens. A single file allows
#    /calibration-report to compute overall_accuracy in one read.
#    Per-actor narrative records (memory/calibration/actors/<slug>.md) layer
#    on top when patterns need narrative explanation.
#
# 2. Why no per-tier accuracy roll-up at the file level?
#    The per-tier roll-up across all actors lives in monthly/<YYYY-MM>.md.
#    Keeping per-tier here per-actor (not framework-wide) keeps the YAML
#    consumable for read-update-write cycles by /calibration-report.
#
# 3. Why `null` rather than `0.0` for accuracy when n=0?
#    0.0 is a meaningful score (everything missed). null is "no data yet".
#    Conflating those destroys signal.
#
# 4. Why retain `expired` count?
#    Expired = past horizon, no verdict. It's a discipline-health signal
#    (climbing expired count = specificity gate too loose, or /shadow-review
#    cadence too slow). It's NOT an accuracy signal (no verdict to score).
#
# 5. Why mixed counts as falsified?
#    Calibration must be honest, not generous. "Partial match" verdicts
#    are sympathetic to the agent — falsified maintains discipline.
#    The audit trail (adversarial_check field in the shadow YAML) preserves
#    the nuance of why mixed was the human read.
