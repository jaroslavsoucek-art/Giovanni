# ============================================================================
# memory/triage-heuristic.yaml — predictive layer triage rules
# ============================================================================
# Governs which situations get an active /branch-out simulation vs. a passive
# shadow hypothesis vs. ignored entirely. Manually refined based on monthly
# /calibration-report observations.
#
# Default values below are tuned for a small / mid-sized fork. Adjust upward
# for higher-velocity domains, downward for tighter discipline.
# ============================================================================

version: 1.0
last_reviewed: <YYYY-MM-DD>
# Date of most recent /calibration-report-driven refinement.

# ----------------------------------------------------------------------------
# active_branch_out — criteria for /branch-out eligibility
# ----------------------------------------------------------------------------
# When the digest surfaces a situation, /branch-out is run ONLY if ALL of these
# criteria are met. Anything else falls through to shadow_only or is ignored.

active_branch_out:
  required_all:
    - touches_actors_min: 2
      # At least 2 actors materially involved. Single-actor situations are
      # better handled as shadow hypotheses (passive monitoring).

    - actors_must_have_profile: true
      # All key actors must have a memory/stakeholders/<slug>.md profile.
      # Profile depth check (≥partial) is done at /branch-out runtime
      # via the hard-stop rule (see binding rule #3).

    - situation_unresolved: true
      # The decision is still open. Resolved / already-decided situations
      # don't get branch-outs (waste of compute, no decision to surface).

    - time_bound_horizon_days_max: 14
      # The decision must resolve within 14 days. Beyond that, the situation
      # will have evolved enough that a branch-out generated today is stale
      # by decision time.

  daily_max: 3
  # Maximum active branch-outs per day. Above this, the user is in
  # over-prediction mode — likely the digest triage is too generous.
  # Hard fail handled by /branch-out command, not by silent threshold creep.

# ----------------------------------------------------------------------------
# shadow_only — criteria for shadow hypothesis generation
# ----------------------------------------------------------------------------
# When a situation has predictable follow-up but doesn't warrant active
# simulation, generate a shadow hypothesis. ANY of these patterns triggers
# eligibility (not ALL — generation is more permissive than active branch-out).

shadow_only:
  required_any:
    - single_actor_reactive_with_downstream: true
      # Single-actor situation but with a clear downstream effect worth tracking.
      # E.g. "Karim's response time on Priya's email" predicts renewal posture.

    - multi_actor_no_time_bound: true
      # Multi-actor but no decision deadline — observation rather than
      # active steering.

    - passive_signal_with_predictable_followup: true
      # The principal is waiting on a known follow-up signal. Track whether
      # the follow-up arrives in the expected form.

  daily_max: 15
  # Soft cap. Above this, calibration becomes noisy.

  hard_fail_max: 25
  # Hard limit. If exceeded in a single day, /digest aborts shadow generation
  # and surfaces a triage threshold review to the principal. NOT silent
  # threshold creep — discipline matters.

# ----------------------------------------------------------------------------
# passive_default — bias toward passive classification
# ----------------------------------------------------------------------------
# When uncertain whether a situation warrants active branch-out or shadow,
# default to shadow (passive). Active branch-out should be reserved for
# clear-cut high-stakes decisions; ambiguous cases get observed, not simulated.

passive_default: true

# ----------------------------------------------------------------------------
# specificity_gate — anti-vagueness gate for shadow generation
# ----------------------------------------------------------------------------
# Vague hypotheses do not get generated. The gate enforces minimum testability
# at the moment of generation. If a candidate hypothesis fails, it is rejected
# (not stored as vague). /calibration-report tracks rejection counts as a
# discipline health metric.

specificity_gate:
  required_for_generation:
    - expected_signal_search_terms_min: 2
      # At least 2 search terms. Single-term predictions are too broad to test.

    - expected_signal_source_channels_min: 1
      # At least 1 named channel (slack | email | calendar | github | asana etc.).
      # No "we'll know it when we see it".

    - prediction_one_sentence_specific: true
      # Prediction must be a SINGLE specific testable claim. Multi-claim
      # predictions get rejected — split them into multiple hypotheses or
      # narrow to the most testable one.

  reject_if_missing: true
  # If ANY required criterion fails, the candidate is rejected. No degraded
  # generation. Discipline > coverage.

# ----------------------------------------------------------------------------
# decline_thresholds — when NOT to predict at all
# ----------------------------------------------------------------------------
# Explicit veto patterns. Even if active_branch_out or shadow_only criteria
# look met, these patterns block prediction.

decline_thresholds:
  - sub_horizon_1_day: true
    # If the situation resolves within 1 day, prediction adds no value —
    # the principal will know the outcome before the hypothesis matures.

  - fully_determined_outcome: true
    # Calendar event, signed contract, decided plan — outcome is structurally
    # determined, no prediction needed.

  - single_actor_no_downstream: true
    # Single actor with no downstream effect — pure noise.

  - actor_profile_shallow_or_missing: true
    # If the actor's profile is shallow / missing, predictions are noise.
    # Generate a profile-enrichment task instead.

# ----------------------------------------------------------------------------
# Notes
# ----------------------------------------------------------------------------
notes:
  - "Conservative bias: when uncertain, classify as passive (shadow) rather than active (branch-out)"
  - "Daily volumes above daily_max do NOT raise thresholds automatically — manual review only"
  - "Hard fail at shadow_only.hard_fail_max forces re-evaluation, not silent threshold creep"
  - "Specificity gate: 'fewer-but-testable' beats 'many-but-vague'"
  - "Threshold values are tunable per-domain; high-velocity domains may need higher daily_max with tighter specificity_gate"
